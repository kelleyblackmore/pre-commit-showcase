# =============================================================================
# STANDALONE Ansible config.
#
# Two things worth knowing before you copy this:
#
# 1. The upstream ansible-lint hook is `pass_filenames: false` + `always_run:
#    true`. It discovers playbooks and roles itself rather than accepting a file
#    list, so a `files:` key on it does nothing. Scope it with `--project-dir`
#    and an explicit path instead.
#
# 2. ansible-lint bundles yamllint. If you also run the standalone yamllint hook
#    you get every YAML finding twice, from two configs that will eventually
#    disagree. Pick one - here, ansible-lint owns YAML under the Ansible tree.
# =============================================================================
---
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-yaml
        args: [--allow-multiple-documents]
        # Vaulted files are ciphertext, and templates are Jinja2.
        exclude: (vault\.ya?ml$|/vars/vault/|\.j2$)

  - repo: https://github.com/ansible/ansible-lint
    rev: v26.6.0
    hooks:
      - id: ansible-lint
        # Upstream's manifest pins `language_version: python3.14`. Without this
        # override, anyone without that exact interpreter gets:
        #   RuntimeError: failed to find interpreter for ... 'python3.14'
        # ansible-lint's own requires-python is >=3.10, so pinning to a single
        # minor version is stricter than the tool needs.
        language_version: python3
        additional_dependencies:
          - ansible-core>=2.17

  # Refuses to commit a plaintext file that lives where a vaulted one belongs.
  - repo: local
    hooks:
      - id: no-plaintext-vault
        name: vault files must be encrypted
        entry: scripts/check-vault-encrypted.sh
        language: script
        files: (vault\.ya?ml$|/vars/vault/.*\.ya?ml$)

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
