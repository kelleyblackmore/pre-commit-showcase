---
# Owner shown in the MOTD banner.
#
# The `baseline_` prefix is not decoration: ansible-lint's production profile
# enforces var-naming[no-role-prefix], because role variables share one global
# namespace at runtime. Two roles both defining `motd_owner` silently clobber
# each other.
baseline_motd_owner: unassigned

# Packages installed on every host.
baseline_packages:
  - ca-certificates
  - curl

# Timezone applied to every host.
baseline_timezone: UTC

# When true, the SSH daemon is reconfigured to refuse password authentication.
baseline_ssh_disable_password_auth: true
