# cpplint configuration.
#
# cpplint reads every CPPLINT.cfg from the linted file's directory up to the
# filesystem root, so this one file covers everything under stacks/cpp/.
#
# `set noparent` stops the search here - without it, cpplint would keep walking
# up into the monorepo root and pick up unrelated settings.
set noparent

linelength=100

# build/header_guard  - we use `#pragma once`, which is universally supported by
#                       the compilers this project targets and cannot drift out
#                       of sync with the file path the way a guard macro can.
# legal/copyright     - no per-file copyright banner in this repo.
# build/include_subdir- headers are included relative to src/, not the repo root.
filter=-build/header_guard,-legal/copyright,-build/include_subdir
