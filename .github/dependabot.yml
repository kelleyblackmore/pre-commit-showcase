---
# Validated by the `check-dependabot` hook (check-jsonschema).
#
# Dependabot understands the `pre-commit` ecosystem and opens one PR per
# outdated hook repository. That is an alternative to the scheduled
# `autoupdate.yml` workflow - running both means duplicate PRs, so pick one.
# This repo keeps Dependabot on the things autoupdate does not cover.
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies]

  - package-ecosystem: npm
    directory: /stacks/javascript
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies]
    ignore:
      # typescript-eslint 8.x declares `typescript: >=4.8.4 <6.1.0`, so TS 6 and
      # 7 are outside the supported range and npm resolves a broken peer tree.
      # Without this, Dependabot re-opens the same unmergeable PR every week.
      # Revisit when typescript-eslint widens the range.
      - dependency-name: typescript
        update-types: [version-update:semver-major]

  - package-ecosystem: docker
    directory: /stacks/container
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies]

  - package-ecosystem: terraform
    directory: /stacks/terraform
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies]

  - package-ecosystem: nuget
    directory: /stacks/csharp/src/Showcase
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies]
